[package]
name = "jj-hooks"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
description = "Run pre-commit / lefthook / hk hooks against jj bookmark pushes"
repository = "https://github.com/mattwilkinsonn/jj-hooks"
readme = "README.md"

# cargo-binstall metadata. `cargo binstall jj-hooks` will fetch the release
# tarball matching the user's platform from our GitHub Releases page, untar
# it, and drop the binary into ~/.cargo/bin. The friendly slug names
# (darwin-arm64, linux-x64, linux-arm64) come from .github/workflows/release.yml
# — keep them aligned with that file.
[package.metadata.binstall]
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/jj-hooks-v{ version }-linux-x64.tar.gz"
bin-dir = "jj-hooks-v{ version }-linux-x64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/jj-hooks-v{ version }-linux-arm64.tar.gz"
bin-dir = "jj-hooks-v{ version }-linux-arm64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/jj-hooks-v{ version }-darwin-arm64.tar.gz"
bin-dir = "jj-hooks-v{ version }-darwin-arm64/{ bin }{ binary-ext }"

[[bin]]
name = "jj-hooks"
path = "src/main.rs"

[[bin]]
name = "jj-hp"
path = "src/bin/jj-hp.rs"

[lib]
name = "jj_hooks"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "env"] }
clap_complete = { version = "4.6.5", features = ["unstable-dynamic"] }
dialoguer = { version = "0.12.0", default-features = false }
regex = "1.12.3"
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
indoc = "2.0.6"

[profile.release]
lto = "thin"
strip = "symbols"
