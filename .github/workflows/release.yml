name: release

# Triggered by pushing a version tag (`jj git push --tag v0.3.12`).
#
# Builds release artifacts for jj-hooks, attaches them to a GitHub
# Release, bumps Formula/jj-hooks.rb in the consolidated
# mattwilkinsonn/homebrew-tap, and publishes the Rust crate to
# crates.io.

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re-)build a release for. Must already exist."
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # ----- Compute the version we're releasing.
  meta:
    name: Compute release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
              tag="$TAG_INPUT"
          else
              tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in *[$'\n\r']*) echo "error: tag contains a newline" >&2; exit 1 ;; esac
          [[ "$tag" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || { echo "error: invalid tag: $tag" >&2; exit 1; }
          version="${tag#v}"
          if [[ "$tag" == *-* ]]; then
              prerelease=true
          else
              prerelease=false
          fi
          {
              echo "tag=${tag}"
              echo "version=${version}"
              echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  # ----- Build the Rust binaries (jj-hooks, jj-hp).
  #
  # Per-target matrix keyed on (target_name, runs_on, rust_target).
  # macOS-latest is Apple Silicon (arm64); Linux runners cover x64
  # and arm64 separately. Both binaries build in one cargo invocation
  # per target, so we don't pay setup cost twice per platform.
  build-rust:
    name: Build Rust (${{ matrix.target_name }})
    needs: [meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: darwin-arm64
            runs_on: macos-latest
            rust_target: aarch64-apple-darwin
          - target_name: linux-x64
            runs_on: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - target_name: linux-arm64
            runs_on: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable
          rustup target add ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target_name }}"

      - name: Build release binaries (jj-hooks, jj-hp)
        run: |
          cargo build --release --target ${{ matrix.rust_target }} \
              --bin jj-hooks --bin jj-hp

      # ----- Stage + tar jj-hooks' artifacts.
      #
      # The tool gets its own tarball named after the slug the
      # Homebrew formula expects:
      #   jj-hooks-v<X>-<slug>.tar.gz  (contains jj-hooks + jj-hp)
      #
      # Codesigning on macOS is ad-hoc (`codesign -s -`) so the
      # binary doesn't get the "downloaded from internet" quarantine
      # warning. Real Developer-ID signing needs an Apple cert pair
      # in secrets and is out-of-scope for an MVP-stage release.
      - name: Stage jj-hooks artifacts
        id: stage_jj_hooks
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          ver="$VER"
          stage="$RUNNER_TEMP/jj-hooks-v${ver}-${{ matrix.target_name }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.rust_target }}/release/jj-hooks" "$stage/"
          cp "target/${{ matrix.rust_target }}/release/jj-hp" "$stage/"
          cp README.md "$stage/"
          cp LICENSE-MIT LICENSE-APACHE "$stage/"
          echo "dir=$stage" >> "$GITHUB_OUTPUT"

      - name: Codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign -s - "${{ steps.stage_jj_hooks.outputs.dir }}/jj-hooks"
          codesign -s - "${{ steps.stage_jj_hooks.outputs.dir }}/jj-hp"

      - name: Tar + sha256
        id: pack
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          ver="$VER"
          stage="$RUNNER_TEMP/jj-hooks-v${ver}-${{ matrix.target_name }}"
          tar -C "$(dirname "$stage")" -czf "$stage.tar.gz" "$(basename "$stage")"
          (cd "$(dirname "$stage")" && shasum -a 256 "$(basename "$stage").tar.gz" > "$(basename "$stage").tar.gz.sha256")

      - name: Upload Rust artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rust-${{ matrix.target_name }}
          path: |
            ${{ runner.temp }}/jj-hooks-v*.tar.gz
            ${{ runner.temp }}/jj-hooks-v*.sha256
          if-no-files-found: error

  # ----- Create the GitHub Release and attach every tarball.
  publish-release:
    name: Publish GitHub Release
    needs: [meta, build-rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) \
              -exec cp {} release/ \;
          ls -la release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            --repo "$GITHUB_REPOSITORY"
            --title "$TAG"
            --notes "Release $TAG. See CHANGELOG.md for details."
            --verify-tag
          )
          if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
          fi
          # `gh release create` hard-fails when the release already exists,
          # which cascades skips into bump-tap + publish-crates on any
          # workflow_dispatch re-run. Create only when absent; the upload
          # step below refreshes the assets either way.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $TAG already exists; skipping create"
          else
              gh release create "$TAG" "${args[@]}"
          fi

      # Always runs, so a first release and a re-run over an existing
      # release both end with the current assets attached.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
              release/jj-hooks-v*.tar.gz \
              release/jj-hooks-v*.sha256 \
              --clobber --repo "$GITHUB_REPOSITORY"

  # ----- Bump Formula/jj-hooks.rb in mattwilkinsonn/homebrew-tap.
  bump-tap:
    name: Bump Homebrew tap formula
    needs: [meta, build-rust, publish-release]
    runs-on: ubuntu-latest
    # Skip prereleases — tap should only track stable.
    if: needs.meta.outputs.prerelease == 'false'
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Mint a short-lived (~1 hour) installation token for the
      # zireael-release GitHub App. The bump commit lands on
      # mattwilkinsonn/homebrew-tap's main, which the default
      # GITHUB_TOKEN cannot reach at all (it is scoped to this repo) and
      # which is branch-protected anyway. The App is in the bypass actors
      # list for the main-branch ruleset, so its pushes skip the
      # PR-required + status-checks-required gates.
      #
      # App configuration:
      #   - App ID:        ${{ vars.RELEASE_BOT_APP_ID }}     (repo variable)
      #   - Private key:   ${{ secrets.RELEASE_BOT_PRIVATE_KEY }} (repo secret)
      #   - Permissions:   contents:write + metadata:read (least-privilege)
      #   - Installed on:  this repo + mattwilkinsonn/homebrew-tap
      #   - Bypass actor:  main-branch ruleset in each installed repo
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # `repositories` REPLACES the current-repo default rather than
          # extending it, so jj-hooks has to be listed alongside the tap
          # or the self checkout below fails to authenticate.
          owner: mattwilkinsonn
          repositories: |
            jj-hooks
            homebrew-tap

      - uses: actions/checkout@v6
        with:
          # The self checkout carries .github/scripts/bump-formulae.py,
          # which rewrites the formula inside the tap checkout below.
          # ref: main (not the release tag) so the bump always runs the
          # current script.
          ref: main
          fetch-depth: 0
          # Checkout with the App token so the local git remotes carry a
          # cred the bot can push with. actions/checkout also writes this
          # token into .git/config's extraheader, so the plain `git push`
          # in the tap checkout Just Works without re-auth.
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v6
        with:
          # The formula now lives in the consolidated tap, not in this
          # repo, so the bump is a cross-repo commit.
          repository: mattwilkinsonn/homebrew-tap
          path: tap
          # The tag that triggered this workflow is irrelevant to the tap;
          # the bump must land on top of the tap's current main or the
          # push is rejected as non-fast-forward.
          ref: main
          # Required: the fetch + rebase guard in `Commit + push` cannot
          # rebase across the default depth-1 shallow boundary.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract per-platform SHA256s
        id: shas
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          ver="$VER"
          for tool in jj-hooks; do
              for slug in darwin-arm64 linux-x64 linux-arm64; do
                  # Find the .sha256 file; artifact-name prefix is rust-*
                  # so just glob.
                  file=$(find artifacts -name "${tool}-v${ver}-${slug}.tar.gz.sha256" | head -1)
                  if [ -z "$file" ]; then
                      echo "error: missing sha256 for ${tool} ${slug}" >&2
                      exit 1
                  fi
                  sha=$(awk '{print $1}' "$file")
                  echo "${tool}-${slug}=${sha}" >> "$GITHUB_OUTPUT"
              done
          done

      # Fail closed before rewriting anything. bump-formulae.py skips a
      # missing formula and returns 0, and `Commit + push`'s own
      # `git diff --quiet Formula/` then exits 0 "nothing to bump" — so
      # without this guard an un-revived (or still-disabled) tap formula
      # yields a GREEN bump-tap that ships nothing. Runs from the
      # workspace root, hence the `tap/` prefix.
      - name: Verify the tap formula is live
        run: |
          set -euo pipefail
          if [ ! -f tap/Formula/jj-hooks.rb ]; then
              echo "error: tap/Formula/jj-hooks.rb is missing — refusing to ship a no-op bump" >&2
              exit 1
          fi
          if grep -q 'disable!' tap/Formula/jj-hooks.rb; then
              echo "error: tap/Formula/jj-hooks.rb is still disabled — refusing to bump it" >&2
              exit 1
          fi

      - name: Rewrite the formula in-place
        env:
          VER: ${{ needs.meta.outputs.version }}
          # Pass every per-slug sha as one env var per entry. The
          # python script reads them into a dict and rewrites the formula.
          JJ_HOOKS_DARWIN_ARM64: ${{ steps.shas.outputs.jj-hooks-darwin-arm64 }}
          JJ_HOOKS_LINUX_X64: ${{ steps.shas.outputs.jj-hooks-linux-x64 }}
          JJ_HOOKS_LINUX_ARM64: ${{ steps.shas.outputs.jj-hooks-linux-arm64 }}
        # bump-formulae.py resolves Path("Formula") relative to its CWD, so
        # it runs in the tap checkout while the script itself is read from
        # the self checkout at the workspace root.
        working-directory: tap
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/bump-formulae.py"
      - name: Commit + push
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        # Run in the tap checkout so `origin` is the tap remote.
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet Formula/; then
              echo "nothing to bump"
              exit 0
          fi
          # Author the commit as the App's bot identity. The App
          # slug is `zireael-release` (visible at
          # https://github.com/apps/zireael-release), so the noreply
          # email follows the standard `<id>+<slug>[bot]@...` form.
          # The numeric ID matches the App ID (vars.RELEASE_BOT_APP_ID)
          # — every GitHub App gets a bot user with id == app_id.
          git config user.name "zireael-release[bot]"
          git config user.email "${{ vars.RELEASE_BOT_APP_ID }}+zireael-release[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "chore(tap): bump formulae to ${TAG}"
          # Main can advance while the release builds artifacts. Rebase the
          # formula bump over the latest main immediately before pushing so
          # the bot push stays a fast-forward instead of leaving the tap stale.
          git fetch origin main:refs/remotes/origin/main
          git rebase origin/main
          git push origin HEAD:main

  # ----- Validate the freshly published tap installs end-to-end.
  validate-tap:
    name: Validate tap (${{ matrix.os }})
    needs: [meta, bump-tap]
    if: needs.meta.outputs.prerelease == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      - name: Tap, install, and test the formula
        run: |
          set -euo pipefail
          brew tap mattwilkinsonn/tap
          brew trust mattwilkinsonn/tap
          for formula in jj-hooks; do
            echo "::group::${formula}"
            brew install "mattwilkinsonn/tap/${formula}"
            brew test "mattwilkinsonn/tap/${formula}"
            echo "::endgroup::"
          done

  # ----- Publish to crates.io.
  publish-crates:
    name: Publish to crates.io
    needs: [meta, build-rust, publish-release, validate-tap]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.meta.outputs.prerelease == 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install stable

      - name: cargo publish jj-hooks
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p jj-hooks --locked
